
[project]
name = "winpilot"
version = "0.1.0"
description = "AI-assisted Windows desktop automation with MCP"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.33.0",
    "mcp[cli]>=2.3.0",
    "pytest>=9.2.0",
    "pywin32>=312; sys_platform == 'win32'",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
nlp = [
    "scikit-learn>=1.5",
    "torch>=2.6",
    "transformers>=4.50",
]

[tool.uv]
package = false
