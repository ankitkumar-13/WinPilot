[[package]]
name = "winpilot"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "google-genai" },
    { name = "mcp", extra = ["cli"] },
    { name = "pytest" },
    { name = "python-dotenv" },
    { name = "pywin32", marker = "sys_platform == 'win32'" },
]

