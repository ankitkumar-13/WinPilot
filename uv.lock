    { name = "mcp", extras = ["cli"], specifier = ">=2.3.0" },
    { name = "pytest", specifier = ">=9.2.0" },
    { name = "python-dotenv", specifier = ">=1.2.4" },
    { name = "pywin32", marker = "sys_platform == 'win32'", specifier = ">=312" },
    { name = "scikit-learn", marker = "extra == 'nlp'", specifier = ">=1.5" },
    { name = "torch", marker = "extra == 'nlp'", specifier = ">=2.6" },
    { name = "transformers", marker = "extra == 'nlp'", specifier = ">=4.50" },
]
provides-extras = ["nlp"]
